name: Generate sitemap & search index

on:
  push:
    branches:
      - main
    paths-ignore:
      - "sitemap.xml"
      - "data/search_index.json"

  # Allow manual trigger from the Actions tab
  workflow_dispatch:

jobs:
  generate:
    name: Generate sitemap.xml & search_index.json
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Use a PAT or the default GITHUB_TOKEN
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate sitemap.xml
        run: python scripts/generate_sitemap.py

      - name: Generate search_index.json
        run: python scripts/generate_search_index.py

      - name: Commit and push generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml data/search_index.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: regenerate sitemap.xml and search_index.json [skip ci]"
            git push
          fi
